name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: MCP server & HTTP API (type-check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check (tsc)
        run: npm run build
      - name: Tests (vitest)
        run: npm test

  site:
    name: CV site (tests + Astro build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cv-site/package-lock.json
      - run: npm ci
      - name: Tests (vitest)
        run: npm test
      - name: Build (astro)
        run: npm run build
